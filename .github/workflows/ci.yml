# Every job calls a Makefile target, never a raw tool, so a local run and a CI
# run are the same run. Adding a check means adding a target first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: spec self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      # Recomputes every store path in docs/spec/examples/ from the derivation
      # text alone. If the spec and the reference disagree, this fails.
      - run: make spec-check

  differential:
    name: differential vs real Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      # The golden files came from a pinned Nix. This regenerates them and
      # fails if upstream Nix has changed what it emits, which is the only
      # way we find out that the oracle moved under us.
      - run: make differential
