# Every job calls a Makefile target, never a raw tool, so a local run and a CI
# run are the same run. Adding a check means adding a target first.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: spec self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No setup-python: every target runs in a pinned container, so the
      # runner's own interpreter is never used and cannot drift.
      # Recomputes every store path in docs/spec/examples/ from the derivation
      # text alone. If the spec and the reference disagree, this fails.
      - run: make spec-check

  differential:
    name: differential vs real Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Instantiates a probe with the pinned Nix and recomputes every store
      # path in the resulting closure. Fails if we broke something OR if
      # upstream Nix changed how paths are derived, which is the only way we
      # find out that the oracle moved under us.
      - run: make differential

  python:
    name: python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # ruff, mypy --strict and pytest, all in the pinned image.
      - run: make python-lint
      - run: make python-test
      - run: make python-build

  rust:
    name: rust lint, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # rustfmt, clippy with -D warnings, and the test suite, all in the
      # pinned image. No dtolnay/rust-toolchain: the toolchain is the image.
      - run: make rust-lint
      - run: make rust-test
      - run: make rust-build

  go:
    name: go vet, fmt and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # gofmt, go vet and the race detector, all in the pinned image. No
      # actions/setup-go: the toolchain is the image.
      - run: make go-lint
      # Go has no build step, so the generated parser is committed and can go
      # stale. An edit to grammar.y that nobody regenerated still compiles and
      # still parses the OLD language, which is the worst kind of green.
      - run: make check-parser
      - run: make go-test
      - run: make go-build

  ocaml:
    name: ocaml fmt, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # ocamlformat, dune build and alcotest, all in the pinned image. No
      # setup-ocaml: the toolchain is the image, and dune plus alcotest are
      # installed into a cache volume on first use.
      - run: make ocaml-lint
      - run: make ocaml-test
      - run: make ocaml-build

  conformance:
    name: conformance across implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # THE experiment. Both eDSLs describe the same ten intents; the bytes
      # are diffed against each other AND against what real Nix emitted, so
      # two implementations agreeing on the wrong answer still fails.
      - run: make conformance

  corpus:
    name: random real nixpkgs derivations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A FRESH RANDOM SAMPLE every run. The point is to keep finding cases a
      # fixed corpus never would: hand-written examples agreed 12 times out of
      # 12 while real ones disagreed 323 times out of 403.
      - run: make corpus N=10

  nixpkgs-parse:
    name: random real nixpkgs expressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The PARSER's differential oracle, and the same design as `corpus`: the
      # nixpkgs tree is pinned by commit so a failure reproduces, while WHICH
      # files are sampled is random so CI keeps reaching constructions a fixed
      # list never would. `nix-instantiate --parse` re-prints the tree it
      # parsed, so this pins tree SHAPE and not merely "it parsed".
      #
      # It found eight distinct bug classes on its first run, against a parser
      # that already passed 59 hand-written vectors.
      - run: make nixpkgs-parse N=300 IMPLS='ocaml python rust go'

  nar-check:
    name: NAR, and a derivation with inputSrcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The last unspecified corner of the format, and the one half of the .drv
      # references rule nothing else could exercise: every derivation the other
      # jobs build has an EMPTY inputSrcs, so "the path lists inputDrvs UNION
      # inputSrcs" was verified on one side only.
      #
      # Two oracles, because the second subsumes the first only if the first
      # holds: `nix-store --add` on a deliberately awkward tree (empty file,
      # a payload already aligned to eight, an executable, a nested directory,
      # a symlink, and two names that sort differently by byte than by locale),
      # then a derivation whose inputSrcs is one of those paths, required to
      # match nix-instantiate in BYTES and in its own store path.
      - run: make nar-check

  worked-example:
    name: a real package through the surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The eleven conformance intents pin the SERIALIZATION and are
      # derivations nobody would write. This pins the SURFACE: one real
      # package, with stdenv, a nixpkgs dependency, an overlay and a fixed
      # point, required to instantiate to the same store path as the
      # hand-written Nix beside it.
      - run: make worked-example
